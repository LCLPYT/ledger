name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      server_released: ${{ steps.release.outputs.release_created }}
      server_version: ${{ steps.release.outputs.version }}
      core_released: ${{ steps.release.outputs['jvm/core--release_created'] }}
      kotlin_released: ${{ steps.release.outputs['jvm/kotlin--release_created'] }}
    steps:
      # an app token, unlike GITHUB_TOKEN, lets the release PR trigger the PR check workflows
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  server:
    needs: release-please
    if: needs.release-please.outputs.server_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.server_version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  clients:
    needs: release-please
    if: needs.release-please.outputs.core_released == 'true' || needs.release-please.outputs.kotlin_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # core first: the kotlin artifact depends on the core one
      - name: Publish
        env:
          CORE_RELEASED: ${{ needs.release-please.outputs.core_released }}
          KOTLIN_RELEASED: ${{ needs.release-please.outputs.kotlin_released }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ "$CORE_RELEASED" = "true" ]; then ./gradlew :core:build :core:publish; fi
          if [ "$KOTLIN_RELEASED" = "true" ]; then ./gradlew :kotlin:build :kotlin:publish; fi
