[versions]
java = "25"
jvm-target-core = "8"
jvm-target-kotlin = "17"
kotlin = "2.4.21"
junit-jupiter = "6.0.1"
protobuf-plugin = "0.9.5"
protobuf = "4.36.2"
grpc = "1.85.0"
grpc-kotlin = "1.5.0"
protovalidate = "1.3.0"
google-common-protos = "2.78.0"
kotlinx-coroutines = "1.11.0"
gradle-build-tools = "1.8.0"

[libraries]
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protoc-gen-grpc-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpc-kotlin" }
protovalidate = { module = "build.buf:protovalidate", version.ref = "protovalidate" }
google-common-protos = { module = "com.google.api.grpc:proto-google-common-protos", version.ref = "google-common-protos" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
java-library = { id = "java-library" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
gradle-build-utils = { id = "gradle-build-utils", version.ref = "gradle-build-tools" }
maven-publish = { id = "maven-publish" }
