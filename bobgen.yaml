no_tests: true

psql:
  driver: github.com/jackc/pgx/v5/stdlib
  schemas: ["public"]
  except:
    goose_db_version:
  queries:
    - internal/db/queries

plugins:
  models:
    destination: gen/go/bob/model
    pkgname: model
  enums:
    destination: gen/go/bob/enums
    pkgname: enums
  dbinfo:
    disabled: true
  dberrors:
    disabled: true
  factory:
    disabled: true
