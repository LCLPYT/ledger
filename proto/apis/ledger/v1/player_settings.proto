syntax = "proto3";

package apis.ledger.v1;

import "apis/auth/v1/auth.proto";
import "apis/ledger/v1/rules.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lclpyt/ledger/gen/go/apis/ledger/v1;ledgerv1";
option (google.api.resource_definition) = {
  type: "ledger.lclpnet.work/Player"
  pattern: "players/{player}"
  singular: "player"
  plural: "players"
};

// PlayerSettingsService manages arbitrary settings of players, managed by game servers.
// Settings are organized as a tree by their dot separated path, e.g. "general.preferred_language".
// Every setting is a leaf.
service PlayerSettingsService {
  // Get a single setting of a player.
  rpc GetPlayerSetting(GetPlayerSettingRequest) returns (PlayerSetting) {
    option (apis.auth.v1.requirement) = {permission: "player_settings.read"};
    option (google.api.http) = {get: "/v1/{name=players/*/settings/*}"};
    option (google.api.method_signature) = "name";
  }

  // List settings of a player, optionally restricted to a subtree.
  rpc ListPlayerSettings(ListPlayerSettingsRequest) returns (ListPlayerSettingsResponse) {
    option (apis.auth.v1.requirement) = {permission: "player_settings.read"};
    option (google.api.http) = {get: "/v1/{parent=players/*}/settings"};
    option (google.api.method_signature) = "parent";
  }

  // Set the value of a setting. The setting is created if it does not exist yet.
  // (-- api-linter: core::0134::method-signature=disabled
  //     aip.dev/not-precedent: the request has no update_mask. --)
  rpc UpdatePlayerSetting(UpdatePlayerSettingRequest) returns (PlayerSetting) {
    option (apis.auth.v1.requirement) = {permission: "player_settings.write"};
    option (google.api.http) = {
      patch: "/v1/{player_setting.name=players/*/settings/*}"
      body: "player_setting"
    };
    option (google.api.method_signature) = "player_setting";
  }

  // Reset a setting to the default value by deleting the player setting entry that serves as overwrite to the default.
  rpc DeletePlayerSetting(DeletePlayerSettingRequest) returns (google.protobuf.Empty) {
    option (apis.auth.v1.requirement) = {permission: "player_settings.write"};
    option (google.api.http) = {delete: "/v1/{name=players/*/settings/*}"};
    option (google.api.method_signature) = "name";
  }
}

// Request message to get a player setting.
message GetPlayerSettingRequest {
  // Resource name of the setting to get.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "ledger.lclpnet.work/PlayerSetting"},
    (buf.validate.field).string.max_len = 512,
    (buf.validate.field).string.(player_setting_name) = true
  ];
}

// Request message to list player settings.
message ListPlayerSettingsRequest {
  // Resource name of the player whose settings to list.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "ledger.lclpnet.work/PlayerSetting"},
    (buf.validate.field).string.(player_name) = true
  ];

  // Maximum number of settings to return. Fewer settings may be returned.
  // If unspecified, 50 settings will be returned.
  // Maximum value is 1000 and higher values will be clamped.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // Page token received from the previous list call.
  // If provided, the subsequent page will be returned.
  string page_token = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 4096
  ];

  // (-- api-linter: core::0132::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a subtree lookup by path is simpler than a filter expression. --)
  // If set, only the setting with this exact path and settings below it are returned.
  // For example, "game.ap2" matches "game.ap2" and "game.ap2.pvp", but not "game.ap2x".
  string path_prefix = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 255
      pattern: "^[a-z][a-z0-9_]{0,62}(\\.[a-z][a-z0-9_]{0,62}){0,15}$"
    }
  ];
}

// Response message of the list player settings request.
message ListPlayerSettingsResponse {
  // The page of settings, ordered by path.
  repeated PlayerSetting player_settings = 1;

  // Token that can be used in the next list request in order to retrieve the next page.
  string next_page_token = 2;
}

// Request message to create or replace a player setting.
// (-- api-linter: core::0134::request-mask-required=disabled
//     aip.dev/not-precedent: value is the only writable field. --)
message UpdatePlayerSettingRequest {
  // The setting to write. Its name identifies the setting.
  PlayerSetting player_setting = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// Request message to delete a player setting.
message DeletePlayerSettingRequest {
  // Resource name of the setting to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "ledger.lclpnet.work/PlayerSetting"},
    (buf.validate.field).string.max_len = 512,
    (buf.validate.field).string.(player_setting_name) = true
  ];
}

// A single setting of a player.
message PlayerSetting {
  option (google.api.resource) = {
    type: "ledger.lclpnet.work/PlayerSetting"
    pattern: "players/{player}/settings/{setting}"
    singular: "playerSetting"
    plural: "playerSettings"
  };

  // Resource name of the setting.
  // {player} is the Minecraft account UUID (v4) of the player in lowercase canonical form.
  // {setting} is the dot separated path of the setting, e.g. "general.preferred_language".
  // Each path segment must start with a lowercase letter and contain only lowercase letters,
  // digits and underscores. Paths are limited to 16 segments and 255 characters.
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.max_len = 512,
    (buf.validate.field).string.(player_setting_name) = true
  ];

  // Value of the setting. Must not be null, delete the setting instead.
  google.protobuf.Value value = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Time when the setting was first written.
  google.protobuf.Timestamp create_time = 100 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time when the setting was last written.
  google.protobuf.Timestamp update_time = 101 [(google.api.field_behavior) = OUTPUT_ONLY];
}
